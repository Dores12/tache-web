# Netlify – nasadenie webu Tache.
# main = produkcia, dev = náhľad. Bez build príkazu, publikuje sa koreň.
# Každé nasadenie stojí 15 z 300 kreditov mesačne, preto sa zmeny zbierajú
# na vetve dev a do main idú najviac 2 až 3-krát týždenne.

[build]
  publish = "."

# --- Bezpečnostné hlavičky -------------------------------------------------
# CSP zatiaľ nie, pridá sa až po spustení merania.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    X-Frame-Options = "DENY"

# --- Cache ----------------------------------------------------------------
# Fonty a obrázky rok. CSS a JS nemajú v názve verziu, preto im dlhú cache
# nedávame a necháme platiť predvolené overovanie cez ETag.

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Interné cesty vracajú 404 --------------------------------------------
# Pracovné dokumenty, návrhy a nástroje sa nesmú dať otvoriť na webe.
# Po nasadení over v náhľade, že všetky tieto cesty naozaj vracajú 404.

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/google-apps-script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_input/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/spustit-web.command"
  to = "/404.html"
  status = 404
  force = true
